services:
  # ============================================
  # WORKER SERVICE (Consumer)
  # ============================================
  consumer:
    build:
      context: ./
      dockerfile: Dockerfile
    image: consumer-service
    container_name: consumer-service
    env_file:
      - ./.env.example
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      HEALTH_PORT: "3001"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: tickets_db
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "3001:3001"
    # depends_on:
      # rabbitmq:
      #   condition: service_healthy
      # postgres:
      #   condition: service_healthy
    restart: no